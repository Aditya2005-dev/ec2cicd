name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Build Spring Boot application
      - name: Build with Maven
        run: mvn clean package

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t docadityaa/ec2pipeline:latest .

      # Push Docker Image
      - name: Push Docker Image
        run: |
          docker push docadityaa/ec2pipeline:latest

      # Deploy on EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            echo "Pull latest image"
            docker pull docadityaa/ec2pipeline:latest

            echo "Stop existing container"
            docker stop ec2pipeline || true

            echo "Remove existing container"
            docker rm ec2pipeline || true

            echo "Remove old image"
            docker rmi docadityaa/ec2pipeline:latest || true

            echo "Remove unused Docker images"
            docker image prune -af

            echo "Pull latest image again"
            docker pull docadityaa/ec2pipeline:latest

            echo "Run new container"
            docker run -d \
              --name ec2pipeline \
              -p 8080:8080 \
              --restart unless-stopped \
              docadityaa/ec2pipeline:latest

            echo "Deployment Completed Successfully"